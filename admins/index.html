<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — HELIX Song API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14111c; --surface:#1c1826; --surface-2:#241f30; --border:#332c42;
    --text:#f4f0fa; --text-muted:#9d93b0; --text-faint:#6c6280;
    --accent:#ffb627; --accent-2:#2dd4bf; --danger:#ff6b6b;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sora:'Sora', sans-serif; --inter:'Inter', sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 800px 500px at 15% 0%, rgba(255,182,39,0.07), transparent),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(45,212,191,0.06), transparent),
      var(--bg);
    color:var(--text); font-family:var(--inter); padding:20px;
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .card{
    width:100%; max-width:420px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:32px;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(135deg, var(--accent), #ff8a3d);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:16px; height:16px; }
  .brand b{ font-family:var(--sora); font-weight:700; font-size:15px; }
  .brand span{ display:block; font-size:11.5px; color:var(--text-faint); font-family:var(--mono); }

  h1{ font-family:var(--sora); font-size:21px; margin:0 0 6px; }
  p.sub{ color:var(--text-muted); font-size:13.5px; margin:0 0 24px; }

  label{ display:block; font-size:12.5px; font-family:var(--mono); color:var(--text-faint); margin:16px 0 6px; }
  input{
    width:100%; padding:11px 13px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-family:var(--inter); font-size:14px;
  }
  input:focus{ border-color:var(--accent); }

  .btn{
    width:100%; margin-top:22px; padding:12px; border-radius:8px; border:none;
    background:var(--accent); color:#1a1408; font-weight:600; font-size:14.5px;
    font-family:var(--inter); cursor:pointer;
  }
  .btn:hover{ background:#ffc554; }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-secondary:hover{ border-color:var(--text-faint); background:transparent; }

  .error-msg{
    display:none; margin-top:14px; padding:10px 12px; border-radius:8px;
    background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3);
    color:var(--danger); font-size:13px;
  }
  .error-msg.show{ display:block; }

  .success-msg{
    display:none; margin-top:14px; padding:10px 12px; border-radius:8px;
    background:rgba(45,212,191,0.1); border:1px solid rgba(45,212,191,0.3);
    color:var(--accent-2); font-size:13px;
  }
  .success-msg.show{ display:block; }

  /* Dashboard (shown after login) */
  #dashboard{ display:none; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0; }
  .stat-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:16px;
  }
  .stat-box b{ display:block; font-family:var(--sora); font-size:24px; }
  .stat-box span{ font-size:11.5px; color:var(--text-faint); font-family:var(--mono); }

  .divider{ height:1px; background:var(--border); margin:24px 0; }

  .logout-link{
    display:inline-block; margin-top:18px; font-size:12.5px; color:var(--text-faint);
    text-decoration:none; cursor:pointer;
  }
  .logout-link:hover{ color:var(--text-muted); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 14V10M9 17V7M14 20V4M19 14V10" stroke="#1a1408" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    <div>
      <b>HELIX Song API</b>
      <span>ADMIN PANEL</span>
    </div>
  </div>

  <!-- Login form -->
  <div id="login-view">
    <h1>Sign in</h1>
    <p class="sub">Enter your admin credentials to manage the rate limit.</p>

    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <button class="btn" id="login-btn">Sign in</button>
    <div class="error-msg" id="login-error"></div>
  </div>

  <!-- Dashboard, shown after successful login -->
  <div id="dashboard">
    <h1>Rate limit</h1>
    <p class="sub">Changes apply immediately, live traffic included.</p>

    <div class="stat-grid">
      <div class="stat-box">
        <b id="stat-max">—</b>
        <span>MAX REQUESTS</span>
      </div>
      <div class="stat-box">
        <b id="stat-window">—</b>
        <span>WINDOW (MIN)</span>
      </div>
    </div>
    <div class="stat-box" style="margin-bottom:22px;">
      <b id="stat-clients">—</b>
      <span>ACTIVE CLIENTS TRACKED</span>
    </div>

    <div class="divider"></div>

    <label for="edit-max">Max requests per window</label>
    <input id="edit-max" type="number" min="1" />

    <label for="edit-window">Window length (minutes)</label>
    <input id="edit-window" type="number" min="1" />

    <button class="btn" id="save-btn">Save changes</button>
    <button class="btn btn-secondary" id="refresh-btn" style="margin-top:10px;">Refresh</button>

    <div class="success-msg" id="save-success"></div>
    <div class="error-msg" id="save-error"></div>

    <a class="logout-link" id="logout-btn">Sign out</a>
  </div>
</div>

<script>
  const API_BASE = ""; // same origin — leave blank if admin.html is served from your API host
  let credentials = null; // { user, pass } — kept in memory only, never stored on disk

  const loginView = document.getElementById("login-view");
  const dashboard = document.getElementById("dashboard");
  const loginBtn = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");

  function authHeader(){
    return "Basic " + btoa(`${credentials.user}:${credentials.pass}`);
  }

  async function fetchSettings(){
    const res = await fetch(`${API_BASE}/admin/settings`, {
      headers: { Authorization: authHeader() }
    });
    if (!res.ok) throw new Error(res.status === 401 ? "Invalid credentials." : "Failed to load settings.");
    return res.json();
  }

  async function attemptLogin(){
    loginError.classList.remove("show");
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    if (!user || !pass) {
      loginError.textContent = "Enter both a username and password.";
      loginError.classList.add("show");
      return;
    }
    credentials = { user, pass };
    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in...";
    try {
      const data = await fetchSettings();
      populateDashboard(data);
      loginView.style.display = "none";
      dashboard.style.display = "block";
    } catch (err) {
      credentials = null;
      loginError.textContent = err.message;
      loginError.classList.add("show");
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Sign in";
    }
  }

  function populateDashboard(data){
    document.getElementById("stat-max").textContent = data.settings.maxRequests;
    document.getElementById("stat-window").textContent = data.settings.windowMinutes;
    document.getElementById("stat-clients").textContent = data.activeClients;
    document.getElementById("edit-max").value = data.settings.maxRequests;
    document.getElementById("edit-window").value = data.settings.windowMinutes;
  }

  document.getElementById("login-btn").addEventListener("click", attemptLogin);
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") attemptLogin();
  });

  document.getElementById("refresh-btn").addEventListener("click", async () => {
    try {
      const data = await fetchSettings();
      populateDashboard(data);
    } catch (err) {
      alert(err.message);
    }
  });

  document.getElementById("save-btn").addEventListener("click", async () => {
    const successEl = document.getElementById("save-success");
    const errorEl = document.getElementById("save-error");
    successEl.classList.remove("show");
    errorEl.classList.remove("show");

    const maxRequests = Number(document.getElementById("edit-max").value);
    const windowMinutes = Number(document.getElementById("edit-window").value);

    try {
      const res = await fetch(`${API_BASE}/admin/settings`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: authHeader()
        },
        body: JSON.stringify({ maxRequests, windowMinutes })
      });
      const data = await res.json();
      if (!res.ok || !data.status) throw new Error(data.message || "Failed to save.");
      populateDashboard({ settings: data.settings, activeClients: document.getElementById("stat-clients").textContent });
      successEl.textContent = "Saved. New limits are live now.";
      successEl.classList.add("show");
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add("show");
    }
  });

  document.getElementById("logout-btn").addEventListener("click", () => {
    credentials = null;
    dashboard.style.display = "none";
    loginView.style.display = "block";
    document.getElementById("password").value = "";
  });
</script>

</body>
</html>
